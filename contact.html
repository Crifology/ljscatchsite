<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <title>Contact | LJ's Catch</title>
    <style>
        :root { --navy:#123f50; --aqua:#e5f4f4; --sea:#06758b; --ink:#244b5c; } html { font-size:125%; } @keyframes fade-in-up { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } } * { box-sizing:border-box; margin:0; } body { font-family:"Bubblegum Sans",cursive; color:var(--ink); background:#fff; line-height:1.6; }
        header { position:sticky; top:0; z-index:1000; background:rgba(244,252,252,.95); backdrop-filter:blur(10px); border-bottom:2px solid #35c9c5; } .nav-container { max-width:1200px; margin:auto; padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between; position:relative; } .nav-actions { display:flex; align-items:center; gap:1.4rem; } .logoMainPage { display:inline-flex; align-items:center; gap:1.3rem; color:#075d73; font-size:1.5rem; font-weight:700; text-decoration:none; transition:filter .2s; } .logoMainPage:hover { filter:drop-shadow(0 3px 3px rgba(8,74,94,.28)); } .logoMainPage img { width:170px; height:170px; object-fit:contain; } .nav-links { display:flex; gap:2rem; list-style:none; } .nav-links a { color:var(--navy); font-weight:600; text-decoration:none; transition:color .2s,text-shadow .2s,transform .2s; } .nav-links a:hover,.nav-links a.active { color:var(--sea); } .nav-links a:hover { text-shadow:0 2px 3px rgba(8,74,94,.22); } .store-link { display:inline-block; padding:.4rem .9rem; color:var(--navy); font-weight:600; text-decoration:none; background:#c8f0ed; border:2px solid var(--navy); border-radius:999px; transition:color .2s,transform .2s; } .store-link:hover { color:var(--navy); background:#c8f0ed; text-shadow:none; transform:scale(1.05); } .menu-checkbox,.menu-label { display:none; }
        li a.home-link, li a.home-link:hover { color:#876400; }
        main { max-width:760px; margin:auto; padding:4rem 2rem; } section { padding:2.5rem; background:#edf8f8; border-radius:18px; animation:fade-in-up .5s ease-out both; } h1 { color:#126782; font-size:clamp(2.25rem,5vw,3.5rem); margin-bottom:.75rem; } form { display:grid; gap:1.25rem; margin-top:2rem; } label { color:var(--navy); font-weight:700; } input,textarea { width:100%; margin-top:.4rem; padding:.8rem; color:var(--ink); font:inherit; background:#fff; border:1px solid #72bdc4; border-radius:8px; } textarea { min-height:160px; resize:vertical; } button { justify-self:start; padding:.8rem 1.5rem; color:#fff; font:inherit; font-weight:700; background:#06758b; border:0; border-radius:50px; cursor:pointer; transition:transform .2s,box-shadow .2s; } button:hover:not(:disabled) { transform:scale(1.05); box-shadow:0 4px 10px rgba(8,74,94,.22); } button:disabled { cursor:wait; opacity:.7; } .note { margin-top:1rem; font-size:.9rem; } footer { padding:2rem; text-align:center; color:#174a58; background:var(--aqua); border-top:1px solid #a9dfe0; }
        @media(max-width:768px) { .nav-container { display:grid; grid-template-columns:auto 1fr; row-gap:.75rem; padding:.75rem 1rem; } .logoMainPage { grid-column:1/-1; justify-self:center; gap:.75rem; font-size:1.25rem; } .logoMainPage img { width:72px; height:72px; } .menu-label { display:block; cursor:pointer; font-size:1.5rem; color:#075d73; grid-column:1; align-self:center; } .nav-actions { grid-column:2; justify-self:end; } .nav-links { position:absolute; top:100%; left:0; right:0; flex-direction:column; gap:0; max-height:0; overflow:hidden; background:#176b87; border-bottom:2px solid #35c9c5; transition:max-height .3s ease-out; } .nav-links li { width:100%; text-align:center; } .nav-links a { display:block; padding:1rem; border-bottom:1px solid rgba(6,182,212,.1); } .menu-checkbox:checked ~ .nav-actions .nav-links { max-height:calc(100dvh - 9rem); overflow-y:auto; } section { padding:2rem; } }
        @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
    </style>
</head>
<body>
    <header><div class="nav-container"><a class="logoMainPage" href="index.html"><img src="assets/photos/logo-horizontal-light-transparent.png" alt="LJ's Catch fishing logo"></a><input type="checkbox" id="menu-toggle" class="menu-checkbox"><label for="menu-toggle" class="menu-label" aria-label="Toggle navigation">&#9776;</label><div class="nav-actions"><nav aria-label="Primary navigation"><ul class="nav-links"><li><a class="home-link" href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="gallery.html">Gallery</a></li><li><a class="active" href="contact.html">Contact</a></li></ul></nav><a class="store-link" href="https://ljscatch.myshopify.com" target="_blank" rel="noopener noreferrer">Visit Our Store</a></div></div></header>
    <main><section><h1>Contact LJ's Catch</h1><p>We would love to hear from you.</p><form id="contact-form" action="https://formsubmit.co/ajax/crifology@gmail.com" method="post"><label>Your Name<input type="text" name="name" autocomplete="name" required></label><label>Your Email<input type="email" name="email" autocomplete="email" required></label><label>Message to LJ:<textarea name="message" required></textarea></label><input type="hidden" name="_subject" value="New LJ's Catch website message"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false"><input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none"><button type="submit">Send Email</button></form><p class="note">We will try to respond in a timely fashion to your message!</p></section></main>
    <footer>&copy; 2026 LJ's Catch. Inspired by our love for fishing.</footer>
    <script>
        const contactForm = document.querySelector('#contact-form');
        const submitButton = contactForm.querySelector('button[type="submit"]');

        contactForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!contactForm.reportValidity()) return;

            submitButton.disabled = true;
            submitButton.textContent = 'Sending...';

            try {
                const response = await fetch(contactForm.action, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: new FormData(contactForm)
                });
                const result = await response.json();

                if (!response.ok || result.success === false) throw new Error('The email service rejected the message.');

                contactForm.reset();
                window.alert('Your Email Has Been Sent!');
            } catch (error) {
                window.alert('Your email could not be sent. Please try again in a moment.');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Send Email';
            }
        });
    </script>
</body>
</html>
