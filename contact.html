<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <title>Contact | LJ's Catch</title>
    <style>
        :root { --navy:#123f50; --aqua:#e5f4f4; --sea:#06758b; --ink:#244b5c; } html { font-size:165%; } @keyframes fade-in-up { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } } * { box-sizing:border-box; margin:0; } body { font-family:"Bubblegum Sans",cursive; color:var(--ink); background:#fff; line-height:1.6; }
        header { background:#f4fcfc; border-bottom:2px solid #35c9c5; } .nav { max-width:1200px; margin:auto; padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between; } .nav-actions { display:flex; align-items:center; gap:1.4rem; } .brand { color:#075d73; font-size:1.5rem; font-weight:700; text-decoration:none; transition:filter .2s; } .brand:hover { filter:drop-shadow(0 3px 3px rgba(8,74,94,.28)); } ul { display:flex; gap:2rem; list-style:none; } li a { color:var(--navy); font-weight:600; text-decoration:none; transition:color .2s,text-shadow .2s,transform .2s; } li a:hover,.active { color:var(--sea); } li a:hover { text-shadow:0 2px 3px rgba(8,74,94,.22); } .store-link { display:inline-block; padding:.4rem .9rem; color:var(--navy); font-weight:600; text-decoration:none; background:#c8f0ed; border:2px solid var(--navy); border-radius:999px; transition:color .2s,transform .2s; } .store-link:hover { color:var(--navy); background:#c8f0ed; text-shadow:none; transform:scale(1.05); }
        li a.home-link, li a.home-link:hover { color:#876400; }
        main { max-width:760px; margin:auto; padding:4rem 2rem; } section { padding:2.5rem; background:#edf8f8; border-radius:18px; animation:fade-in-up .5s ease-out both; } h1 { color:#126782; font-size:clamp(2.25rem,5vw,3.5rem); margin-bottom:.75rem; } form { display:grid; gap:1.25rem; margin-top:2rem; } label { color:var(--navy); font-weight:700; } input,textarea { width:100%; margin-top:.4rem; padding:.8rem; color:var(--ink); font:inherit; background:#fff; border:1px solid #72bdc4; border-radius:8px; } textarea { min-height:160px; resize:vertical; } button { justify-self:start; padding:.8rem 1.5rem; color:#fff; font:inherit; font-weight:700; background:#06758b; border:0; border-radius:50px; cursor:pointer; transition:transform .2s,box-shadow .2s; } button:hover { transform:scale(1.05); box-shadow:0 4px 10px rgba(8,74,94,.22); } .note { margin-top:1rem; font-size:.9rem; } footer { padding:2rem; text-align:center; color:#174a58; background:var(--aqua); border-top:1px solid #a9dfe0; }
        @media(max-width:700px) { .nav { flex-direction:column; align-items:flex-start; gap:1rem; } .nav-actions { flex-wrap:wrap; gap:1rem; } ul { flex-wrap:wrap; gap:1rem; } section { padding:2rem; } }
        @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
    </style>
</head>
<body>
    <header><div class="nav"><a class="brand" href="index.html">LJ's Catch</a><div class="nav-actions"><nav aria-label="Primary navigation"><ul><li><a class="home-link" href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="gallery.html">Gallery</a></li><li><a class="active" href="contact.html">Contact</a></li></ul></nav><a class="store-link" href="https://ljscatch.myshopify.com" target="_blank" rel="noopener noreferrer">Visit Our Store</a></div></div></header>
    <main><section><h1>Contact LJ's Catch</h1><p>We would love to hear from you.</p><form action="mailto:ljscatch@gmail.com" method="post" enctype="text/plain"><label>Your Name<input type="text" name="Your Name" autocomplete="name" required></label><label>Your Email<input type="email" name="Your Email" autocomplete="email" required></label><label>Message to LJ:<textarea name="Message to LJ" required></textarea></label><button type="submit">Send Email</button></form><p class="note">Submitting opens your default email app with your message addressed to ljscatch@gmail.com.</p></section></main>
    <footer>&copy; 2026 LJ's Catch. Inspired by time on the water.</footer>
</body>
</html>
