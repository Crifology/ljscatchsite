<!DOCTYPE html>

    <style>
        :root { --navy:#123f50; --aqua:#e5f4f4; --sea:#06758b; --ink:#244b5c; } html { font-size:125%; } @keyframes fade-in-up { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } } * { box-sizing:border-box; margin:0; } body { font-family:"Bubblegum Sans",cursive; color:var(--ink); background:#fff; line-height:1.6; }
        header { position:sticky; top:0; z-index:1000; background:rgba(244,252,252,.95); backdrop-filter:blur(10px); border-bottom:2px solid #35c9c5; } .nav-container { max-width:1200px; margin:auto; padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between; position:relative; } .nav-actions { display:flex; align-items:center; gap:1.4rem; } .logoMainPage { display:inline-flex; align-items:center; gap:1.3rem; color:#075d73; font-size:1.5rem; font-weight:700; text-decoration:none; transition:filter .2s; } .logoMainPage:hover { filter:drop-shadow(0 3px 3px rgba(8,74,94,.28)); } .logoMainPage img { width:104px; height:104px; object-fit:contain; border:2px solid #35c9c5; border-radius:50%; } .nav-links { display:flex; gap:2rem; list-style:none; } .nav-links a { color:var(--navy); font-weight:600; text-decoration:none; transition:color .2s,text-shadow .2s,transform .2s; } .nav-links a:hover,.nav-links a.active { color:var(--sea); } .nav-links a:hover { text-shadow:0 2px 3px rgba(8,74,94,.22); } .store-link { display:inline-block; padding:.4rem .9rem; color:var(--navy); font-weight:600; text-decoration:none; background:#c8f0ed; border:2px solid var(--navy); border-radius:999px; transition:color .2s,transform .2s; } .store-link:hover { color:var(--navy); background:#c8f0ed; text-shadow:none; transform:scale(1.05); } .menu-checkbox,.menu-label { display:none; }
        li a.home-link, li a.home-link:hover { color:#876400; }
        main { max-width:1200px; margin:auto; padding:4rem 2rem; } h1 { color:#126782; font-size:clamp(2.25rem,5vw,3.5rem); text-align:center; animation:fade-in-up .5s ease-out both; } .lead { max-width:650px; margin:1rem auto 2.5rem; text-align:center; animation:fade-in-up .5s .12s ease-out both; } .gallery { display:grid; grid-template-columns:repeat(3,1fr); gap:1.25rem; } .photo { overflow:hidden; aspect-ratio:1 / 1; background:#edf8f8; border:1px solid #72bdc4; border-radius:14px; transition:transform .25s ease,border-width .25s ease; animation:fade-in-up .5s ease-out both; } .photo:hover { transform:scale(1.04); border-width:3px; } .photo img { display:block; width:100%; height:100%; object-fit:cover; } .photo:nth-child(1) { animation-delay:.24s; } .photo:nth-child(2) { animation-delay:.36s; } .photo:nth-child(3) { animation-delay:.48s; }
        footer { padding:2rem; text-align:center; color:#174a58; background:var(--aqua); border-top:1px solid #a9dfe0; } @media(max-width:768px) { .nav-container { display:grid; grid-template-columns:auto 1fr; row-gap:.75rem; padding:.75rem 1rem; } .logoMainPage { grid-column:1/-1; justify-self:center; gap:.75rem; font-size:1.25rem; } .logoMainPage img { width:72px; height:72px; } .menu-label { display:block; cursor:pointer; font-size:1.5rem; color:#075d73; grid-column:1; align-self:center; } .nav-actions { grid-column:2; justify-self:end; } .nav-links { position:absolute; top:100%; left:0; right:0; flex-direction:column; gap:0; max-height:0; overflow:hidden; background:#176b87; border-bottom:2px solid #35c9c5; transition:max-height .3s ease-out; } .nav-links li { width:100%; text-align:center; } .nav-links a { display:block; padding:1rem; border-bottom:1px solid rgba(6,182,212,.1); } .menu-checkbox:checked ~ .nav-actions .nav-links { max-height:calc(100dvh - 9rem); overflow-y:auto; } .gallery { grid-template-columns:1fr; } } @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
    </style>
</head>
